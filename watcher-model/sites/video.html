<title>Video Player</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:#111318}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let phase = 'loading';
  let phaseStart = performance.now();
  let loadDuration = randDelay();
  let restartRect = null;
  let W = 0, H = 0, dpr = 1;

  function randDelay(){ return 1000 + Math.random() * 3000; }

  function resize(){
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function rr(x, y, w, h, r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  const SIZE = 360;
  function content(){ return { x: (W - SIZE)/2, y: (H - SIZE)/2, s: SIZE }; }

  // Player rectangle (16:9-ish) within content area.
  function player(){
    const { x, y, s } = content();
    const pw = s, ph = s * 0.62;
    return { x, y: y + (s - ph)/2 - 10, w: pw, h: ph };
  }

  function drawRestart(){
    const bw = 76, bh = 30;
    const x = W - bw - 16, y = 16;
    restartRect = { x, y, w: bw, h: bh };
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    rr(x, y, bw, bh, 8); ctx.fill();
    ctx.fillStyle = '#e8e8ee';
    ctx.font = '13px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Restart', x + bw/2, y + bh/2 + 1);
  }

  function drawLoading(now){
    ctx.fillStyle = '#111318';
    ctx.fillRect(0, 0, W, H);
    const p = player();

    // Dark player rectangle
    ctx.fillStyle = '#000000';
    rr(p.x, p.y, p.w, p.h, 12); ctx.fill();

    // Three bouncing "buffering" dots (scale + opacity animate)
    const cx = p.x + p.w/2, cy = p.y + p.h/2;
    const t = (now - phaseStart) / 1000;
    const spacing = 26, baseR = 7;
    for (let i = 0; i < 3; i++){
      const ph2 = t * 4 + i * 0.6;
      const k = (Math.sin(ph2) + 1) / 2;         // 0..1
      const r = baseR * (0.6 + 0.7 * k);
      ctx.globalAlpha = 0.4 + 0.6 * k;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(cx + (i - 1) * spacing, cy, r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawLoaded(){
    ctx.fillStyle = '#f4f4f8';
    ctx.fillRect(0, 0, W, H);
    const { x, y } = content();
    const p = player();

    ctx.fillStyle = '#1f2430';
    ctx.font = '700 24px system-ui, sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('Now Playing', x, p.y - 16);

    // Dark player
    ctx.fillStyle = '#0b0d12';
    rr(p.x, p.y, p.w, p.h, 12); ctx.fill();

    // White play triangle centered
    const cx = p.x + p.w/2, cy = p.y + p.h/2;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(cx - 16, cy - 22);
    ctx.lineTo(cx - 16, cy + 22);
    ctx.lineTo(cx + 24, cy);
    ctx.closePath();
    ctx.fill();

    // Scrubber line with round knob near the left
    const sx = p.x, sy = p.y + p.h + 26, sw = p.w;
    ctx.strokeStyle = '#c9ccd6';
    ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + sw, sy); ctx.stroke();
    // played portion
    const knobX = sx + sw * 0.18;
    ctx.strokeStyle = '#ef4444';
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(knobX, sy); ctx.stroke();
    ctx.fillStyle = '#ef4444';
    ctx.beginPath(); ctx.arc(knobX, sy, 8, 0, Math.PI*2); ctx.fill();

    // Small time bar
    ctx.fillStyle = '#c9ccd6';
    rr(sx, sy + 20, 70, 10, 5); ctx.fill();
  }

  function frame(now){
    if (phase === 'loading'){
      if (now - phaseStart >= loadDuration){ phase = 'loaded'; }
      else { drawLoading(now); drawRestart(); requestAnimationFrame(frame); return; }
    }
    drawLoaded(); drawRestart();
    requestAnimationFrame(loadedIdle);
  }
  function loadedIdle(){
    if (phase !== 'loaded'){ requestAnimationFrame(frame); return; }
    drawLoaded(); drawRestart();
    requestAnimationFrame(loadedIdle);
  }

  function restart(){
    phase = 'loading'; phaseStart = performance.now(); loadDuration = randDelay();
    requestAnimationFrame(frame);
  }

  canvas.addEventListener('click', function(e){
    const r = canvas.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    if (restartRect && mx >= restartRect.x && mx <= restartRect.x + restartRect.w &&
        my >= restartRect.y && my <= restartRect.y + restartRect.h){ restart(); }
  });

  requestAnimationFrame(frame);
})();
</script>
