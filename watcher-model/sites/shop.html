<title>Product Page</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:#16171c}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let phase = 'loading';
  let phaseStart = performance.now();
  let loadDuration = randDelay();
  let restartRect = null;
  let W = 0, H = 0, dpr = 1;

  function randDelay(){ return 1000 + Math.random() * 3000; }

  function resize(){
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function rr(x, y, w, h, r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  const SIZE = 360;
  function content(){ return { x: (W - SIZE)/2, y: (H - SIZE)/2, s: SIZE }; }

  // Shared layout: image square on top, then text bars + button.
  function layout(){
    const { x, y, s } = content();
    const imgS = 200;
    return {
      image: { x: x + (s - imgS)/2, y: y, w: imgS, h: imgS },
      priceY: y + imgS + 40,
      bars: [
        { x: x + 20, y: y + imgS + 56, w: s - 40, h: 12 },
        { x: x + 20, y: y + imgS + 78, w: s - 120, h: 12 }
      ],
      button: { x: x + 20, y: y + s - 40, w: s - 40, h: 46 }
    };
  }

  function drawRestart(){
    const bw = 76, bh = 30;
    const x = W - bw - 16, y = 16;
    restartRect = { x, y, w: bw, h: bh };
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    rr(x, y, bw, bh, 8); ctx.fill();
    ctx.fillStyle = '#e8e8ee';
    ctx.font = '13px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Restart', x + bw/2, y + bh/2 + 1);
  }

  function drawLoading(now){
    ctx.fillStyle = '#16171c';
    ctx.fillRect(0, 0, W, H);
    const { x, y, s } = content();
    const L = layout();
    const g = '#2b2d34';

    ctx.fillStyle = g;
    rr(L.image.x, L.image.y, L.image.w, L.image.h, 12); ctx.fill();
    // price placeholder
    rr(L.image.x, L.priceY - 20, 90, 22, 6); ctx.fill();
    L.bars.forEach(b => { rr(b.x, b.y, b.w, b.h, 6); ctx.fill(); });
    rr(L.button.x, L.button.y, L.button.w, L.button.h, 12); ctx.fill();

    // Diagonal shimmer sweep across content area.
    const t = ((now - phaseStart) / 1200) % 1;
    const bandW = 120;
    const px = x - bandW + t * (s + bandW * 2);
    ctx.save();
    rr(x, y, s, s, 12); ctx.clip();
    const grad = ctx.createLinearGradient(px, y, px + bandW, y + s);
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(0.5, 'rgba(255,255,255,0.10)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(x - 40, y, s + 80, s);
    ctx.restore();
  }

  function drawLoaded(){
    ctx.fillStyle = '#f4f4f8';
    ctx.fillRect(0, 0, W, H);
    const { x, y } = content();
    const L = layout();

    ctx.fillStyle = '#1f2430';
    ctx.font = '700 24px system-ui, sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('Product', x + 20, y - 14);

    // Coral product square
    ctx.fillStyle = '#ff6f61';
    rr(L.image.x, L.image.y, L.image.w, L.image.h, 12); ctx.fill();

    // Price with fillText
    ctx.fillStyle = '#111827';
    ctx.font = '800 32px system-ui, sans-serif';
    ctx.fillText('$49', L.image.x, L.priceY);

    // Two dark text bars
    ctx.fillStyle = '#2b2f3a';
    L.bars.forEach(b => { rr(b.x, b.y, b.w, b.h, 6); ctx.fill(); });

    // Green "Add to cart" button bar
    ctx.fillStyle = '#22c55e';
    rr(L.button.x, L.button.y, L.button.w, L.button.h, 12); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = '600 16px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Add to cart', L.button.x + L.button.w/2, L.button.y + L.button.h/2 + 1);
  }

  function frame(now){
    if (phase === 'loading'){
      if (now - phaseStart >= loadDuration){ phase = 'loaded'; }
      else { drawLoading(now); drawRestart(); requestAnimationFrame(frame); return; }
    }
    drawLoaded(); drawRestart();
    requestAnimationFrame(loadedIdle);
  }
  function loadedIdle(){
    if (phase !== 'loaded'){ requestAnimationFrame(frame); return; }
    drawLoaded(); drawRestart();
    requestAnimationFrame(loadedIdle);
  }

  function restart(){
    phase = 'loading'; phaseStart = performance.now(); loadDuration = randDelay();
    requestAnimationFrame(frame);
  }

  canvas.addEventListener('click', function(e){
    const r = canvas.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    if (restartRect && mx >= restartRect.x && mx <= restartRect.x + restartRect.w &&
        my >= restartRect.y && my <= restartRect.y + restartRect.h){ restart(); }
  });

  requestAnimationFrame(frame);
})();
</script>
